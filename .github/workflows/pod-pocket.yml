name: Pod Pocket

on:
  push:
    branches: [pod-pocket]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Branding and disabled features are applied
        run: |
          python3 scripts/podpocket/rebrand_strings.py --check
          python3 scripts/podpocket/disable_features.py --check
          python3 -B scripts/podpocket/test_rebrand_strings.py
      - name: Unit tests
        run: >
          ./gradlew
          :modules:services:selfhosted:testDebugUnitTest
          :modules:services:servers:testDebugUnitTest --tests '*SelfHostedNetworkModuleTest' --tests '*GeneratedTranscriptsDisabledTest'
          :modules:features:account:testDebugUnitTest --tests '*LogInStateTest'
          :modules:features:profile:testDebugUnitTest --tests '*ProfileSectionTest'
          :modules:services:crashlogging:testDebugUnitTest
          :modules:services:analytics:testDebugUnitTest --tests '*ExperimentProviderTest' --tests '*TrackerBindingsTest'
          :modules:services:repositories:testDebugUnitTest --tests '*Media3LibrarySessionCallbackTest'
          :modules:services:ui:testDebugUnitTest --tests '*AppIconTest'
          :app:testDebugUnitTest --tests '*MainActivityViewModelTest'

  other-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Wear, TV and Automotive still compile
        run: ./gradlew :wear:compileDebugKotlin :tv:compileDebugKotlin :automotive:compileDebugKotlin

  apk:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Version
        id: version
        run: |
          upstream=$(sed -n 's/^versionName=//p' version.properties)
          revision=$(sed -n 's/^revision=//p' pod-pocket.properties)
          echo "name=${upstream}-pp.${revision}" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version v${{ steps.version.outputs.name }}"
            exit 1
          fi
      - name: Signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set, building a debug APK instead of a signed release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ORG_GRADLE_PROJECT_signingKeyStoreFile: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_signingKeyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PskipSentryProguardMappingUpload=true
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "pod-pocket-${{ steps.version.outputs.name }}.apk"
      - name: Debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "pod-pocket-${{ steps.version.outputs.name }}-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: pod-pocket-apk
          path: pod-pocket-*.apk
          if-no-files-found: error
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "pod-pocket-${{ steps.version.outputs.name }}.apk"
          --title "Pod Pocket ${{ steps.version.outputs.name }}"
          --notes "Signed release build of Pod Pocket ${{ steps.version.outputs.name }}."
      - name: GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "pod-pocket-${{ steps.version.outputs.name }}-debug.apk"
          --prerelease
          --title "Pod Pocket ${{ steps.version.outputs.name }} (debug build)"
          --notes "Unsigned debug build of Pod Pocket ${{ steps.version.outputs.name }}. It installs side by side with a release build as net.garulf.podpocket.debug."
